[package]
name = "openbook-app"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1", features = ["time"] }
# The bundled TypeScript server (`@book.dev/server`) is launched as a sidecar
# via the shell plugin (v2 moved `tauri::api::process` here).
tauri-plugin-shell = "2"
# `openbook://auth-callback` deep links carry the account.book.pub sign-in token
# back to the running app (see `app/src/App.tsx`).
tauri-plugin-deep-link = "2"
# Exactly one process must own the embedded PGlite store; a second launch hands
# off to the running instance (focus its window) instead of starting a competing
# data layer. Registered first so it intercepts before the rest of setup.
tauri-plugin-single-instance = "2"
# Native folder picker (choose the book-mirror directory) + open-in-file-manager
# (reveal it). Used from Rust commands, not invoked directly from JS.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Self-update (OB-342): fetches the manifest from the endpoint pinned in
# tauri.conf.json and applies signed updater archives, verifying each against
# the pinned minisign pubkey. `process` provides the post-install relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Random access tokens for the published-server gate.
uuid = { version = "1", features = ["v4"] }
# The streaming IPC bridge (`api_request_stream`) base64-encodes each body chunk
# before sending it over the Tauri `Channel`: a JSON integer array expands raw
# bytes ~4–6×, base64 ~1.33×, and the tunnel now streams every forwarded request.
base64 = "0.22"

# On Unix we ask the server sidecar to shut down gracefully (SIGTERM) on quit so
# it can flush pending writes before exit, rather than hard-killing it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The per-device forwarding site key (the Ed25519 private key) lives in the OS
# keychain, behind the keychain_* commands. Native backend per platform: macOS
# Keychain, Windows Credential Manager, Linux Secret Service.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
