name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build (libs) + typecheck + lint + unit tests + server e2e — the single gate
  # developers run locally as `pnpm verify`.
  verify:
    name: Verify (build · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Secrets hygiene first (ST-1): fail fast if any private-key material is
      # committed (Ed25519/EC/RSA PKCS#8 base64, PEM blocks, minisign secret
      # keys) outside the explicitly allowlisted test fixtures. Runs before
      # the toolchain setup — it needs only git.
      - name: Guard — no committed private-key material
        run: bash scripts/check-no-private-keys.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify

  # Beancount reference gate (LGR-13): bean-check on the fixture exports plus
  # the Fava/OpenBook trial-balance parity comparison, against a PINNED Python
  # and a PINNED beancount. "Optional-but-gating": this job installs the
  # toolchain and then REQUIRES it (OPENBOOK_REQUIRE_BEANCOUNT=1 turns the
  # local graceful skip into a failure), so when it runs, it gates. The same
  # vitest file runs inside `verify` too, where it skips — with a printed
  # notice — on machines without Python+beancount.
  beancount:
    name: Beancount reference (bean-check + Fava parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python (pinned)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install beancount (pinned)
        run: python -m pip install beancount==3.1.0

      # Same libs cache as the e2e jobs: the ui test suite resolves
      # @book.dev/sdk from its built dist.
      - name: Cache built libs
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/dist
            packages/ui/dist
            packages/mcp/dist
            packages/server/dist
            packages/server/assets
          key: ${{ runner.os }}-libs-${{ hashFiles('packages/sdk/src/**', 'packages/sdk/package.json', 'packages/sdk/tsconfig.json', 'packages/ui/src/**', 'packages/ui/resources/**', 'packages/ui/package.json', 'packages/ui/tsconfig.json', 'packages/ui/vite.config.js', 'packages/ui/postcss.config.js', 'packages/mcp/src/**', 'packages/mcp/package.json', 'packages/mcp/tsconfig.json', 'packages/mcp/tsup.config.ts', 'packages/server/src/**', 'packages/server/package.json', 'packages/server/tsconfig.json', 'packages/server/tsup.config.ts', 'pnpm-lock.yaml') }}
      - name: Build libs
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: pnpm run build:libs

      - name: bean-check fixture exports + Fava parity (to the cent)
        env:
          OPENBOOK_REQUIRE_BEANCOUNT: "1"
        run: pnpm run test:beancount

  # Ledger durability gate (LGR-15): backup → destroy → restore → diff, plus the
  # performance benchmarks with thresholds ASSERTED — on BOTH storage backends:
  # embedded PGlite and a PINNED real-Postgres service container. Real Postgres
  # is not a nicety here: the wire driver has its own parameter serialization
  # (the PGlite-only era hid a jsonb double-encoding bug this job now pins).
  # Same optional-but-gating pattern as `beancount`: locally these suites skip
  # the Postgres half with a loud notice; OPENBOOK_REQUIRE_LEDGER_PG=1 makes an
  # absent server a FAILURE, so the coverage can never be lost silently.
  # Benchmark numbers land in the job summary; the thresholds are the board's
  # own numbers at ×1 (OPENBOOK_BENCH_TIME_MULTIPLIER is a local-machine escape
  # hatch, deliberately NOT set here — see docs/ledger/backup-restore.md).
  durability:
    name: Ledger durability (restore round-trip + benchmarks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENBOOK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      OPENBOOK_REQUIRE_LEDGER_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same libs cache as the other jobs: the server suite resolves
      # @book.dev/sdk from its built dist.
      - name: Cache built libs
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/dist
            packages/ui/dist
            packages/mcp/dist
            packages/server/dist
            packages/server/assets
          key: ${{ runner.os }}-libs-${{ hashFiles('packages/sdk/src/**', 'packages/sdk/package.json', 'packages/sdk/tsconfig.json', 'packages/ui/src/**', 'packages/ui/resources/**', 'packages/ui/package.json', 'packages/ui/tsconfig.json', 'packages/ui/vite.config.js', 'packages/ui/postcss.config.js', 'packages/mcp/src/**', 'packages/mcp/package.json', 'packages/mcp/tsconfig.json', 'packages/mcp/tsup.config.ts', 'packages/server/src/**', 'packages/server/package.json', 'packages/server/tsconfig.json', 'packages/server/tsup.config.ts', 'pnpm-lock.yaml') }}
      - name: Build libs
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: pnpm run build:libs

      # The 500-transaction parity book (LGR-13), seeded through the real API —
      # backup → destroy → restore, byte + semantic diff incl. the LGR-7
      # verifier and the audit chain, on PGlite AND the service container.
      - name: Restore round-trip (parity fixture, both backends)
        env:
          OPENBOOK_RESTORE_FIXTURE: parity
        run: pnpm --filter @book.dev/server exec vitest run src/ledgerRestore.test.ts

      # Thresholds asserted (trial balance @10k postings < 500 ms; 1k-row
      # import < 5 s), medians reported into $GITHUB_STEP_SUMMARY.
      - name: Ledger benchmarks (thresholds asserted, both backends)
        run: pnpm run bench:ledger

  # Real-Postgres lost-update proof (CWD-11). This stays in the PR gate rather
  # than nightly: the suite has four small store scenarios, each in an isolated
  # scratch database, and needs no browser or server listener. The expected-live
  # CWD-2/3/4 races use `test.fails`; their fixes flip those cases to plain tests.
  postgres-concurrency:
    name: Postgres concurrency (write races)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENBOOK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      OPENBOOK_REQUIRE_CONCURRENCY_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK dependency
        run: pnpm --filter @book.dev/sdk run build
      - name: Exercise deterministic write races on real Postgres
        run: pnpm --filter @book.dev/server run test:pg

  # Fast P1 core gate — a quick early canary on pull requests (OB-225). Runs only
  # the @p1 specs minus anything tagged @flaky (`test:e2e:core`): ~15 tests in a
  # single job (~1.4min), so no shard matrix. It surfaces core breakage fast; the
  # full sharded suite (`e2e` below) now also runs on PRs for complete coverage.
  e2e-p1:
    name: Playwright P1 gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same caching as the sharded `e2e` job (built libs / Playwright browsers /
      # Next dev cache) so the gate reuses warm caches.
      - name: Cache built libs
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/dist
            packages/ui/dist
            packages/mcp/dist
            packages/server/dist
            packages/server/assets
          key: ${{ runner.os }}-libs-${{ hashFiles('packages/sdk/src/**', 'packages/sdk/package.json', 'packages/sdk/tsconfig.json', 'packages/ui/src/**', 'packages/ui/resources/**', 'packages/ui/package.json', 'packages/ui/tsconfig.json', 'packages/ui/vite.config.js', 'packages/ui/postcss.config.js', 'packages/mcp/src/**', 'packages/mcp/package.json', 'packages/mcp/tsconfig.json', 'packages/mcp/tsup.config.ts', 'packages/server/src/**', 'packages/server/package.json', 'packages/server/tsconfig.json', 'packages/server/tsup.config.ts', 'pnpm-lock.yaml') }}
      - name: Build libs
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: pnpm run build:libs

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @book.dev/web exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @book.dev/web exec playwright install --with-deps chromium
      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @book.dev/web exec playwright install-deps chromium

      - name: Cache Next.js dev cache
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**/*.[jt]s', 'packages/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run Playwright P1 core gate
        run: pnpm --filter @book.dev/web run test:e2e:core

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-p1
          path: packages/web/playwright-report
          retention-days: 7

  # Full browser e2e against the web shell, sharded across 4 runners. Runs on
  # both `push` to main and pull requests — the workflow only triggers on those
  # two events (see the `on:` block), so no event guard is needed. Running the
  # full suite on PRs gives pre-merge coverage instead of discovering breakage
  # post-merge (which repeatedly reddened `main`). Each shard runs the existing
  # per-shard worker count (playwright.config.ts) and emits a blob report; the
  # `e2e-report` job merges those into one HTML report. The gate is this matrix
  # job — every shard must pass.
  e2e:
    name: Playwright e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other shards when one fails — we still want their blob
      # reports so the merged report covers the whole suite.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the built workspace libs (sdk/ui/server dist) — Next dev and the
      # per-worker data servers resolve @book.dev/* from these. Keyed on lib
      # source + build config + lockfile, so any source change rebuilds.
      - name: Cache built libs
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/dist
            packages/ui/dist
            packages/mcp/dist
            packages/server/dist
            packages/server/assets
          key: ${{ runner.os }}-libs-${{ hashFiles('packages/sdk/src/**', 'packages/sdk/package.json', 'packages/sdk/tsconfig.json', 'packages/ui/src/**', 'packages/ui/resources/**', 'packages/ui/package.json', 'packages/ui/tsconfig.json', 'packages/ui/vite.config.js', 'packages/ui/postcss.config.js', 'packages/mcp/src/**', 'packages/mcp/package.json', 'packages/mcp/tsconfig.json', 'packages/mcp/tsup.config.ts', 'packages/server/src/**', 'packages/server/package.json', 'packages/server/tsconfig.json', 'packages/server/tsup.config.ts', 'pnpm-lock.yaml') }}
      - name: Build libs
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: pnpm run build:libs

      # Resolve the installed Playwright version so the browser cache busts on
      # upgrade rather than serving binaries for the wrong version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @book.dev/web exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # On a cache miss, download browsers + OS deps. On a hit the browser
      # binaries are restored from cache, but the apt-level OS deps never are,
      # so install just those.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @book.dev/web exec playwright install --with-deps chromium
      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @book.dev/web exec playwright install-deps chromium

      # Cache the Next.js dev compile cache to speed `next dev` startup.
      - name: Cache Next.js dev cache
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**/*.[jt]s', 'packages/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      # Exclude @flaky from the gating full-suite: a demonstrated flake (T1
      # contract) must never red `main`. Those quarantined specs are still
      # monitored nightly (nightly-e2e.yml runs the full suite INCLUDING @flaky).
      - name: Run Playwright e2e (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @book.dev/web exec playwright test --grep-invert @flaky --shard=${{ matrix.shard }}/4 --reporter=blob

      # Blob reports are merge-able; sharding names each file uniquely
      # (report-<shard>.zip), so merge-multiple in `e2e-report` won't collide.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: packages/web/blob-report
          retention-days: 7

  # Merge the per-shard blob reports into a single HTML report. Runs on the same
  # events as the sharded `e2e` job it merges (push + pull_request); `always()`
  # so it still produces a report even when a shard failed, covering the whole
  # suite. This job is NOT the gate (the `e2e` matrix job is), so its success
  # never masks a failed shard.
  e2e-report:
    name: Merge Playwright reports
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: packages/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm --filter @book.dev/web exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

  # Chromatic visual diffs. Pull-request only — visual diffs matter pre-merge,
  # and it's fast + already decoupled from the functional shards (OB-222): it
  # archives only the @visual specs, so it runs once as its own job rather than
  # redundantly inside each of the 4 shards.
  chromatic:
    name: Chromatic visual diffs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs git history for baselines
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache built libs
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/dist
            packages/ui/dist
            packages/mcp/dist
            packages/server/dist
            packages/server/assets
          key: ${{ runner.os }}-libs-${{ hashFiles('packages/sdk/src/**', 'packages/sdk/package.json', 'packages/sdk/tsconfig.json', 'packages/ui/src/**', 'packages/ui/resources/**', 'packages/ui/package.json', 'packages/ui/tsconfig.json', 'packages/ui/vite.config.js', 'packages/ui/postcss.config.js', 'packages/mcp/src/**', 'packages/mcp/package.json', 'packages/mcp/tsconfig.json', 'packages/mcp/tsup.config.ts', 'packages/server/src/**', 'packages/server/package.json', 'packages/server/tsconfig.json', 'packages/server/tsup.config.ts', 'pnpm-lock.yaml') }}
      - name: Build libs
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: pnpm run build:libs
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @book.dev/web exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @book.dev/web exec playwright install --with-deps chromium
      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @book.dev/web exec playwright install-deps chromium
      # Skipped automatically when the token secret isn't set.
      - name: Chromatic visual diffs
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: pnpm run chromatic
