name: Release

on:
  push:
    branches:
      - main
  # Manual kick (still passes through the same approval gate below).
  workflow_dispatch:

permissions:
  contents: read # for checkout

# Only ever process the latest push. A newer run supersedes (cancels) an older
# one that's still queued or parked at the approval gate, so an un-actioned
# approval can't hold the lock and silently cancel every push stacked behind it
# (which is exactly what stalled releases before). The gate therefore always
# reflects the tip of main. Trade-off: a push that lands while an *approved*
# release is actively publishing will cancel it — just re-run that release from
# the Actions tab on the rare occasion it happens.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # Ungated dry run: would the commits on main cut a release at all?
  # Reviewers are only asked to approve when the answer is yes, so routine
  # merges (docs, chores, refactors) don't ping anyone. `nx release --dry-run`
  # makes no changes and needs no token.
  plan:
    name: Plan (dry run)
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.plan.outputs.new_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx reads conventional commits since the last v* tag
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Determine whether a release is due
        id: plan
        run: |
          set -o pipefail
          out=$(npx nx release --dry-run 2>&1) || true
          # GitHub runs this step with `set -eo pipefail`. Both greps below can
          # legitimately match nothing when no release is due (a routine merge,
          # or a commit that only touches root/CI files outside any nx project),
          # which would otherwise abort the step instead of taking the graceful
          # "new_release=false" path. `|| true` keeps a no-match non-fatal.
          echo "$out" | grep -viE '^npm warn' | tail -n 30 || true
          next=$(echo "$out" | grep -oiE 'new version [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          current=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$next" ] && [ "$next" != "$current" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "Release due: v$next (awaiting approval)"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits — nothing to approve."
          fi

  # Pre-tag preflight (review HIGH, Quinn 2026-07-04 — residual): assert the
  # updater signing secret exists BEFORE anything irreversible happens. Updater
  # signing is a hard prerequisite (with createUpdaterArtifacts + a configured
  # pubkey the tauri build errors out when the key is unset), and the tag + npm
  # publish are irreversible — so a secrets-less run must die HERE, not in
  # publish-tauri after `release` has tagged vX.Y.Z and `publish-npm` has
  # shipped the libraries (which would leave a GitHub release with ZERO desktop
  # artifacts). The secret lives in the `publish` environment (alongside the
  # APPLE_* secrets), which the `release` job's own `release` environment cannot
  # read — hence a separate job that opts into `publish`, mirroring how
  # publish-tauri/publish-npm read it. Friction check (2026-07-04): `publish`
  # has NO required reviewers and NO wait timer — only a deployment branch
  # policy (`main` + `v*` tags) that this main-triggered run already satisfies
  # for the two publish jobs — so this adds no approval step and no delay; the
  # single human approval stays exactly where it was, on the `release`
  # environment. Presence check only: nothing about the secret is echoed.
  preflight:
    name: Preflight — updater signing secret
    needs: plan
    if: needs.plan.outputs.new_release == 'true'
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Assert TAURI_SIGNING_PRIVATE_KEY is configured
        env:
          # `secrets` isn't readable in a step-level `if:`; branch on emptiness
          # inside bash instead (same pattern as the publish-tauri guards).
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty/unset in the 'publish' environment. Updater signing is a HARD prerequisite for every release (the tauri build refuses to bundle without it — no unsigned degrade), so refusing BEFORE the release is tagged or npm is published. Set the secret (see docs/release-updates.md) and re-run." >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is configured — release may proceed."

  # The actual release. The `release` environment holds the approval gate:
  # configure it once under Settings → Environments → release → "Required
  # reviewers". Until approved there, this job (and everything after it)
  # stays queued.
  #
  # `nx release` (fixed mode, see nx.json) bumps every package to the new
  # version, writes CHANGELOG.md, commits + tags `vX.Y.Z`, pushes both to main
  # over SSH using DEPLOY_KEY (a write-enabled deploy key authenticates as a real
  # actor, so the push clears branch-protection/ruleset restrictions the ephemeral
  # GITHUB_TOKEN can't). The commit message carries [skip ci], now LOAD-BEARING:
  # unlike a GITHUB_TOKEN push, a deploy-key push to main WOULD re-trigger this
  # `on: push` workflow — [skip ci] is the only thing preventing a release loop,
  # so nx release must keep stamping it. nx release still uses GITHUB_TOKEN for the
  # GitHub Release API. --skip-publish
  # leaves the npm step to the `publish-npm` job below, which ships the two
  # public libraries (@book.dev/sdk + @book.dev/ui); the rest stay private.
  release:
    name: Release v${{ needs.plan.outputs.version }} (on approval)
    # `preflight` gates the tag: nothing irreversible happens on a run whose
    # desktop legs are doomed by a missing signing secret.
    needs: [plan, preflight]
    if: needs.plan.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the version bump + tag, create the GitHub release
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push the version-bump commit + tag over SSH as a write-enabled deploy
          # key (public half: Settings → Deploy keys, "Allow write access"; private
          # half: the DEPLOY_KEY repo secret) instead of the ephemeral GITHUB_TOKEN.
          # persist-credentials keeps the key wired up for nx release's `git push`.
          # Pattern: opengovsg/FormSG#9661 + #9662.
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: true
          fetch-depth: 0
          ref: main # commit/tag land on the branch, not a detached HEAD
      # Refuse to cut a release whose desktop build would ship a non-production
      # updater pubkey (security review MED, 2026-07-04). The pubkey compiled
      # into the app is the updater's trust anchor: installed apps only ever
      # trust the key they shipped with, so releasing the placeholder would
      # burn the update channel for every client that installs that build.
      # Runs BEFORE nx release, so a bad config fails the run before any
      # tag / GitHub release exists. The literal below is the throwaway
      # placeholder key (id 556A7C0F67F480F8) that kept CI green while the
      # production key was minted; its private half was destroyed, so nothing
      # can ever sign for it.
      - name: Guard — refuse to release with a placeholder or missing updater pubkey
        run: |
          conf="packages/app/src-tauri/tauri.conf.json"
          placeholder="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDU1NkE3QzBGNjdGNDgwRjgKUldUNGdQUm5EM3hxVmUxUHVlOEdnVUZQaTlscE5WVUg5d0ZDd0FEeFlZMk1vWWJ2b0VJQTZxV2UK"
          pubkey=$(node -p "(require('./$conf').plugins?.updater?.pubkey) ?? ''")
          if [ -z "$pubkey" ]; then
            echo "::error::$conf has no plugins.updater.pubkey — desktop builds would ship without an update trust anchor. Refusing to release." >&2
            exit 1
          fi
          if [ "$pubkey" = "$placeholder" ]; then
            echo "::error::$conf still carries the PLACEHOLDER updater pubkey (throwaway key 556A7C0F67F480F8). Swap in the production pubkey (see docs/release-updates.md) before releasing." >&2
            exit 1
          fi
          echo "Updater pubkey present and not the placeholder — OK."
      # Plugin-registry trust anchor (ST-1), same shape as the updater guard
      # above: the pinned OPENBOOK_REGISTRY public key must NEVER be the
      # committed TEST key (its private half is public — anyone could sign
      # 'Verified' first-party plugins for every client that installs the
      # build). Runs BEFORE nx release so nothing irreversible happens.
      # NOTE: the CURRENT pinned key is a placeholder whose private half was
      # destroyed — bundles show Unverified until the key ceremony
      # (docs/plugin-signing.md) commits the production key; that degrade is
      # deliberate and only warned about, never fatal.
      - name: Guard — no pinned plugin-registry key may be the committed test key
        run: |
          # OPENBOOK_REGISTRY_KEYS is a LIST (rotation overlap) — every entry
          # is a trust anchor, so every entry gets checked.
          keys=$(node -p "
            const src = require('fs').readFileSync('packages/sdk/src/plugins.ts','utf8');
            const block = src.match(/export const OPENBOOK_REGISTRY_KEYS[\s\S]*?\n\];/)?.[0] ?? '';
            [...block.matchAll(/publicKey: '([^']+)'/g)].map((m) => m[1]).join('\n');
          ")
          testkey=$(node -p "require('./scripts/test-registry-key.json').publicKey")
          if [ -z "$keys" ]; then
            echo "::error::could not read any OPENBOOK_REGISTRY_KEYS publicKey from packages/sdk/src/plugins.ts — the guard cannot vouch for the trust anchor. Refusing to release." >&2
            exit 1
          fi
          while IFS= read -r key; do
            if [ "$key" = "$testkey" ]; then
              echo "::error::packages/sdk/src/plugins.ts pins the COMMITTED TEST registry key (scripts/test-registry-key.json) whose private half is public — every client would trust signatures anyone can mint. Run the key ceremony (docs/plugin-signing.md) before releasing." >&2
              exit 1
            fi
          done <<< "$keys"
          echo "No pinned plugin-registry key equals the committed test key — OK ($(echo "$keys" | wc -l | tr -d ' ') pinned key(s) checked)."
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: nx release — version, changelog, tag, GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: npx nx release --skip-publish

  # Build the desktop bundles per-OS and attach them to the release nx just
  # created. Runs on the tag nx pushed, so tauri.conf.json's
  # "version": "../package.json" resolves to the bumped version.
  publish-tauri:
    name: Build & attach desktop bundles
    needs: [plan, release]
    # The macOS signing/notarization secrets (APPLE_*) live in the `publish`
    # environment, so this job must opt into it to read them — repository-wide
    # secrets aren't used for signing. Keep `publish` WITHOUT required reviewers
    # so it adds no second approval; the release is already gated upstream at the
    # `release` environment (this job `needs` it).
    environment: publish
    permissions:
      contents: write # gh release upload
    strategy:
      fail-fast: false
      matrix:
        # Each leg pins an explicit Rust/Tauri target triple so the build output
        # path is uniform (`target/<triple>/release/bundle`).
        #
        # macOS ships PER-ARCH, not as a single universal binary: the bundled
        # `openbook-server` sidecar is a `bun build --compile` binary, and Bun
        # standalone executables can't be reliably lipo'd into a universal binary
        # (the JS payload is appended past the Mach-O). So we cut a native app +
        # native sidecar for each arch. Both macOS legs run on the arm64
        # macos-latest runner; the x86_64 leg cross-compiles (Rust via the added
        # target, the sidecar via Bun's --target). codesign/notarytool are
        # arch-agnostic, so signing the cross-built Intel app works fine here.
        #
        # ubuntu-20.04 runners were retired by GitHub; 22.04 also matches the
        # Tauri v2 toolchain (webkit2gtk 4.1).
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }} # the tag nx release pushed

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # The server sidecar compiles with `bun build --compile`
      # (packages/server/scripts/build-sidecar.mjs), invoked by Tauri's
      # beforeBuildCommand on every platform.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Authenticode + `bun --compile` corruption was fixed in 1.2.23; do not downgrade below it.
          bun-version: "1.3.14"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Adds the leg's target (e.g. x86_64-apple-darwin on the arm64 runner
          # for the Intel cross-build); a no-op when it's already the host.
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        # libfuse2: linuxdeploy and its appimage plugin are themselves AppImages
        # and self-mount via FUSE; GitHub's ubuntu-22.04 image no longer ships it.
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # AppImage fix (ubuntu only): seed our patched linuxdeploy GTK plugin into
      # Tauri's tool cache so the bundler reuses it instead of downloading the
      # upstream one. The patch keeps linuxdeploy from running `ldd` on the Bun
      # `--compile` openbook-server sidecar, which otherwise SIGABRTs linuxdeploy
      # core (uncaught std::runtime_error "Failed to run ldd") and fails ONLY the
      # AppImage step (.deb/.rpm don't run linuxdeploy). See the .sh header for
      # the full why. macOS/Windows skip this step.
      - name: Seed patched linuxdeploy GTK plugin (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p "$HOME/.cache/tauri"
          cp packages/app/src-tauri/linux/linuxdeploy-plugin-gtk.sh "$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"

      # Per-leg fail-fast preflight (BEFORE the ~long build) — updater signing
      # is a HARD prerequisite, not a graceful degrade (review HIGH, Quinn
      # 2026-07-04, verified vs tauri-cli 2.11 bundle.rs). With
      # bundle.createUpdaterArtifacts=true AND a configured plugins.updater
      # pubkey, the bundler HARD-ERRORS when TAURI_SIGNING_PRIVATE_KEY is unset —
      # it does NOT emit unsigned archives. The PRIMARY gate for that is the
      # top-level `preflight` job, which fails the run before the tag / npm
      # publish; this step is the BACKSTOP so a *standalone re-run of this job*
      # (which skips upstream jobs and could meet a since-changed environment)
      # still refuses cleanly, up front, if either supply-chain precondition is
      # unmet:
      #  (a) TAURI_SIGNING_PRIVATE_KEY is empty/unset, or
      #  (b) tauri.conf.json still carries the throwaway PLACEHOLDER updater
      #      pubkey (a build no future signature could ever satisfy — also
      #      guarded pre-tag in the `release` job).
      # The post-build .sig-count guard below stays as the backstop for the
      # key-present-but-signing-silently-produced-nothing case.
      # Bash 3.2-safe (GitHub's macOS runners), no globstar.
      - name: Preflight — updater signing key + production pubkey (fail fast)
        shell: bash
        env:
          # The `secrets` context is NOT readable in a step-level `if:`, but IS
          # in `env:`, so we branch on emptiness inside bash.
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          conf="packages/app/src-tauri/tauri.conf.json"
          # The throwaway placeholder key (id 556A7C0F67F480F8) whose private half
          # was destroyed; must never ship. Task A swapped in the production key,
          # so a correctly-configured branch passes this grep.
          placeholder="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDU1NkE3QzBGNjdGNDgwRjgKUldUNGdQUm5EM3hxVmUxUHVlOEdnVUZQaTlscE5WVUg5d0ZDd0FEeFlZMk1vWWJ2b0VJQTZxV2UK"
          fail=0
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty/unset. Updater signing is a HARD prerequisite: with createUpdaterArtifacts + a configured pubkey the tauri build errors out (it does not degrade to unsigned). Set it in the 'publish' environment — see docs/release-updates.md." >&2
            fail=1
          fi
          # Plain fixed-string grep (Bash 3.2-safe; no globstar / no `**`).
          if grep -qF "$placeholder" "$conf"; then
            echo "::error::$conf still carries the PLACEHOLDER updater pubkey (throwaway key 556A7C0F67F480F8). Swap in the production pubkey before releasing — see docs/release-updates.md." >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Updater signing key present and production pubkey configured — OK."

      - name: Preflight — Windows Authenticode signing configuration
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          CONFIG_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CONFIG_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CONFIG_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CONFIG_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          CONFIG_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          CONFIG_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          present=0
          missing=0
          for name in CONFIG_TENANT_ID CONFIG_CLIENT_ID CONFIG_CLIENT_SECRET CONFIG_SIGNING_ENDPOINT CONFIG_SIGNING_ACCOUNT CONFIG_SIGNING_PROFILE; do
            val="${!name}"
            val="${val//[[:space:]]/}"
            if [ -z "$val" ]; then
              missing=$((missing + 1))
            else
              present=$((present + 1))
            fi
          done

          if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::Windows signing configuration is partial ($present of 6 values set); refusing to build unsigned." >&2
            exit 1
          fi
          if [ "$missing" -eq 6 ]; then
            if [ "$WINDOWS_SIGNING_REQUIRED" = "1" ]; then
              echo "::error::WINDOWS_SIGNING_REQUIRED=1 but Windows signing configuration is absent." >&2
              exit 1
            fi
            echo "::warning::Windows build is UNSIGNED — Azure Trusted Signing secrets not configured"
            echo "win_signing=0" >> "$GITHUB_ENV"
          else
            echo "Azure Trusted Signing configuration present — Windows binaries and installers will be signed."
            echo "win_signing=1" >> "$GITHUB_ENV"
          fi

      - name: Install Azure Trusted Signing CLI (windows only)
        if: matrix.platform == 'windows-latest' && env.win_signing == '1'
        shell: bash
        run: |
          cargo install --locked trusted-signing-cli --version 0.9.0

      - name: Resolve Windows signing tools
        if: matrix.platform == 'windows-latest' && env.win_signing == '1'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed pinned Azure Trusted Signing dlib
        if: matrix.platform == 'windows-latest' && env.win_signing == '1'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Trusted.Signing.Client.1.0.95.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/1.0.95" -OutFile $package
          # SHA-256 independently computed from the NuGet package on 2026-08-22.
          $expectedSha256 = "3bfcf1e0a3cb42af1692f0a8ed45c15de070c2de86f28a59b2795d904d8a920f"
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "Trusted Signing dlib SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          $destination = Join-Path $env:USERPROFILE ".trusted-signing-cli\lib"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $destination -Force

      # `tauri build` runs its beforeBuildCommand first, which builds the sdk,
      # ui, server sidecar (for SIDECAR_TARGET, set below), and frontend before
      # bundling. (Same as the local `build:desktop` script, plus an explicit
      # --target.)
      - name: Build Tauri bundles
        # Force bash on every runner (incl. Windows Git Bash). The default
        # Windows shell is PowerShell, which parses the leading `@` in
        # `@book.dev/app` as its splatting operator and aborts with a ParserError.
        shell: bash
        env:
          # AppImage bundling hardening (Linux only; ignored elsewhere):
          #  - NO_STRIP: the ~80 MB Bun --compile sidecar has data appended past
          #    the ELF; linuxdeploy's strip step corrupts/fails on it.
          #  - APPIMAGE_EXTRACT_AND_RUN: run the linuxdeploy/appimagetool
          #    AppImages by self-extracting instead of FUSE-mounting.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Tell build-sidecar.mjs (run by Tauri's beforeBuildCommand) which arch
          # to compile the Bun sidecar for. It cross-compiles via Bun's --target
          # only when this differs from the runner's host arch (the Intel macOS
          # leg); otherwise it builds natively, unchanged.
          SIDECAR_TARGET: ${{ matrix.target }}
          # macOS code signing + notarization. Consumed only on the macOS legs;
          # on linux/windows these are unused env and harmless.
          #  - APPLE_CERTIFICATE/_PASSWORD: the base64 Developer ID Application
          #    .p12 + its password. The Tauri bundler imports this into an
          #    ephemeral keychain and auto-detects the signing identity from the
          #    cert, so no APPLE_SIGNING_IDENTITY is needed.
          #  - APPLE_ID/_PASSWORD/_TEAM_ID: notarization via the Apple ID method.
          #    APPLE_PASSWORD must be an app-specific password, not the account
          #    password. Present credentials => the .app is notarized + stapled.
          #  - KEYCHAIN_PASSWORD: only used by the tauri-action helper (the Tauri
          #    CI guide assumes it); the direct `tauri build` path here uses an
          #    ephemeral keychain and ignores it. Passed through for parity.
          # JIT entitlements for the Bun sidecar live in
          # packages/app/src-tauri/entitlements.plist (wired via tauri.conf.json).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Tauri updater artifact signing (all platforms). With
          # bundle.createUpdaterArtifacts=true, the bundler emits per-target
          # updater archives (macOS .app.tar.gz, Linux .AppImage, Windows
          # .msi/.exe) and, when these two are present, a detached `.sig`
          # minisign signature next to each. TAURI_SIGNING_PRIVATE_KEY holds the
          # key material itself (not a path) so no key file is written to disk on
          # the runner; the password unlocks it. Generate the keypair once with
          # `tauri signer generate` (see docs/release-updates.md) and store both
          # halves as the secrets below. These are a HARD prerequisite once a
          # pubkey is configured: with createUpdaterArtifacts=true the bundler
          # REFUSES to build (errors out) when the key is absent — it does NOT
          # degrade to emitting unsigned archives. The preflight step above fails
          # the run fast (before this build) when the key is missing; the
          # post-build .sig guard below is the backstop for a bad key/password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # First-party plugin-registry signing (ST-1): the ui build's
          # gen:bundled-plugins step (run via beforeBuildCommand) signs the
          # bundled PluginPackages with this Ed25519 PKCS#8 key so fresh
          # installs verify against the pinned OPENBOOK_REGISTRY public key.
          # UNSET until the owner performs the key ceremony
          # (docs/plugin-signing.md): the build then falls back — with a loud
          # log warning — to the committed TEST key, and the bundled plugins
          # show Unverified, exactly like pre-signing builds.
          OPENBOOK_REGISTRY_PRIVATE_KEY: ${{ secrets.OPENBOOK_REGISTRY_PRIVATE_KEY }}
          # Windows Authenticode signing via Azure Trusted Signing. The wrapper
          # configured in tauri.conf.json degrades to an unsigned build when any
          # value is absent, while a configured signing command fails the build
          # if Azure or signtool rejects any main binary, sidecar, MSI, or NSIS.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CONFIG_DIR: ${{ runner.temp }}\azure-signing
          # Ceremony step 6 (docs/plugin-signing.md): once the secret above is
          # stored, uncomment so a later loss of the secret FAILS the build
          # instead of silently degrading to the TEST-signed fallback.
          # OPENBOOK_REGISTRY_REQUIRE_KEY: "1"
        # `tauri build --target <triple>` puts bundles under
        # target/<triple>/release/bundle. pnpm forwards the trailing args to the
        # app's `tauri` script.
        #
        # `--verbose` on the ubuntu and Windows legs: Tauri's bundler swallows
        # linuxdeploy's own stdout/stderr unless verbose is on, so a failing
        # AppImage step only ever prints the generic `failed to run linuxdeploy`
        # wrapper (see the ubuntu-22.04 AppImage failures). Verbose surfaces the
        # real linuxdeploy / linuxdeploy-plugin-gtk error (the failing sub-step +
        # file) directly in the CI log, and Windows needs stdout visibility for
        # signing diagnostics. macOS legs evaluate to ''.
        run: pnpm --filter @book.dev/app run tauri build --target ${{ matrix.target }}${{ (matrix.platform == 'ubuntu-22.04' || matrix.platform == 'windows-latest') && ' --verbose' || '' }}

      - name: Remove Azure signing credentials
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ runner.temp }}\azure-signing" -Recurse -Force -ErrorAction SilentlyContinue

      # Fail loudly if signing was configured but produced no signatures. With
      # TAURI_SIGNING_PRIVATE_KEY set, `createUpdaterArtifacts` writes a detached
      # `.sig` next to every updater archive; zero `.sig` files means the key was
      # rejected (bad key/password) or the bundler silently skipped signing — in
      # either case the release would ship un-updatable, so stop here rather than
      # publish it. The preflight above already fails the run when the key is
      # unset, so in CI the empty-key branch below never fires — it stays only as
      # a defensive no-op; this guard's real job is the key-present-but-no-`.sig`
      # (bad key / wrong password) case.
      - name: Guard — updater signatures must exist when signing is configured
        shell: bash
        env:
          # Read the secret into an env var: the `secrets` context is NOT
          # available in a step-level `if:`, but it IS available in `env`, so we
          # branch on emptiness inside bash instead of gating the step.
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY configured (unexpected — the preflight should already have failed the run); skipping backstop."
            exit 0
          fi
          base="packages/app/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Explicit per-dir globs (no `globstar`/`**`): GitHub's macOS runners
          # can resolve `shell: bash` to bash 3.2, which lacks globstar. Each
          # updater archive drops its `.sig` beside it in the same bundle subdir.
          shopt -s nullglob
          sigs=(
            "$base"/macos/*.sig
            "$base"/appimage/*.sig
            "$base"/msi/*.sig
            "$base"/nsis/*.sig
          )
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but NO .sig files were produced under $base." >&2
            echo "The updater artifacts are unsigned — refusing to publish an un-updatable release." >&2
            echo "Check the build log for a 'signing' error (bad key or wrong TAURI_SIGNING_PRIVATE_KEY_PASSWORD)." >&2
            find "$base" -maxdepth 2 -type f 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Found ${#sigs[@]} updater signature(s):"; printf '  %s\n' "${sigs[@]}"

      - name: Guard — Windows installers have Authenticode signatures
        if: matrix.platform == 'windows-latest' && env.win_signing == '1'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }

          $base = "packages/app/src-tauri/target/${{ matrix.target }}/release/bundle"
          $msiInstallers = @(Get-ChildItem "$base/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          $nsisInstallers = @(Get-ChildItem "$base/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          $installers = @($msiInstallers) + @($nsisInstallers)
          if ($installers.Count -lt 2 -or $msiInstallers.Count -lt 1 -or $nsisInstallers.Count -lt 1) {
            Write-Error "Expected at least 2 Windows installers (1 MSI + 1 NSIS) under $base; found $($msiInstallers.Count) MSI and $($nsisInstallers.Count) NSIS."
            exit 1
          }
          foreach ($installer in $installers) {
            & $signtool.FullName verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Authenticode verification failed: $($installer.FullName)"
              exit $LASTEXITCODE
            }
          }
          Write-Host "Verified $($installers.Count) Authenticode-signed Windows installer(s)."

      # Post-build backstop (ST-1, same shape as the .sig guard above): when
      # the plugin-registry secret is set, the bundled first-party plugins the
      # build just signed MUST verify against a pinned OPENBOOK_REGISTRY_KEYS
      # entry — a wrong-key secret would otherwise ship bundles that every
      # fresh install shows as Unverified. Skipped (with a note) while the
      # secret is unset, where the TEST-signed fallback is the documented
      # degrade.
      - name: Guard — bundled plugins signed by a pinned registry key
        shell: bash
        env:
          OPENBOOK_REGISTRY_PRIVATE_KEY: ${{ secrets.OPENBOOK_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$OPENBOOK_REGISTRY_PRIVATE_KEY" ]; then
            echo "OPENBOOK_REGISTRY_PRIVATE_KEY unset — TEST-signed bundle is the documented degrade; skipping backstop."
            exit 0
          fi
          node scripts/check-bundled-signatures.mjs

      - name: Upload bundles to the v${{ needs.release.outputs.version }} release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.release.outputs.version }}"
          # --target builds land under target/<triple>/release/bundle. The two
          # macOS legs produce arch-suffixed DMGs (…_aarch64.dmg / …_x64.dmg), so
          # they attach to the same release without clobbering each other.
          #
          # Installer bundles (.dmg/.deb/.rpm/.msi/.exe) are the human downloads;
          # the *updater* artifacts are the archives the Tauri updater fetches —
          # macOS `.app.tar.gz`, Linux `.AppImage`, Windows `.msi`/nsis `.exe` —
          # each paired with a detached `.sig` minisign signature that the updater
          # verifies against the pubkey baked into the app. Upload every `.sig`
          # (one per updater archive per arch) so the account-server manifest can
          # point at them; without the `.sig` the client rejects the update.
          base="packages/app/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          # macOS updater archive fix: Tauri names it "<ProductName>.app.tar.gz"
          # with NO arch or version, so the two macOS legs (aarch64 + x86_64) both
          # emit `OpenBook.app.tar.gz` and clobber each other on upload
          # (`gh release upload --clobber`), leaving the release with a single
          # arbitrary-arch archive. Worse, the account-server manifest selects the
          # macOS updater asset by an ARCH-SUFFIXED name
          # (`OpenBook_<ver>_{aarch64,x64}.app.tar.gz` — see lib/updates.ts
          # updaterCandidates), so an arch-less name matches nothing and every
          # macOS caller gets 204 "no update". Rename the archive (and its detached
          # `.sig`) per-arch to the name the manifest expects. Signature-safe: the
          # `.sig` signs the archive BYTES, not the filename.
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) mac_arch=aarch64 ;;
            x86_64-apple-darwin)  mac_arch=x64 ;;
            *)                    mac_arch= ;;
          esac
          if [ -n "$mac_arch" ]; then
            ver="${{ needs.release.outputs.version }}"
            for archive in "$base"/macos/*.app.tar.gz; do
              dest="$base/macos/OpenBook_${ver}_${mac_arch}.app.tar.gz"
              [ "$archive" = "$dest" ] && continue
              mv "$archive" "$dest"
              [ -f "$archive.sig" ] && mv "$archive.sig" "$dest.sig"
            done
          fi
          files=(
            "$base"/dmg/*.dmg
            "$base"/macos/*.app.tar.gz
            "$base"/deb/*.deb
            "$base"/rpm/*.rpm
            "$base"/appimage/*.AppImage
            "$base"/msi/*.msi
            "$base"/nsis/*.exe
            # Updater signatures — one `.sig` per updater archive, per target.
            # Explicit per-dir globs (no `globstar`, unavailable on the bash 3.2
            # that GitHub's macOS runners may use): macos/*.app.tar.gz.sig,
            # appimage/*.AppImage.sig, msi/*.msi.sig, nsis/*.sig.
            "$base"/macos/*.sig
            "$base"/appimage/*.sig
            "$base"/msi/*.sig
            "$base"/nsis/*.sig
            # Any Tauri-emitted latest.json (harmless fallback; the account
            # server builds the real manifest dynamically). Wildcard so nullglob
            # drops it when absent — a literal path would slip past nullglob and
            # break the upload. Absent on most legs.
            "$base"/latest*.json
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles found under $base" >&2
            find "$base" -maxdepth 2 -type f 2>/dev/null >&2 || true
            exit 1
          fi
          printf 'Uploading to %s:\n' "$tag"; printf '  %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber

  # Ship the two PUBLIC libraries to npm at the version nx release just cut.
  # Every other package is `private: true`, so only @book.dev/sdk and
  # @book.dev/ui go out. Runs on the freshly-pushed tag, and only after the
  # approved `release` job (so it inherits that approval gate). sdk publishes
  # before ui because ui depends on it; each publish is skipped when that version
  # is already on the registry, so a re-run after a partial failure is safe.
  #
  # Auth: OIDC *trusted publishing* — no long-lived token. The job requests an
  # OIDC id-token (permissions.id-token: write) which the npm CLI (>= 11.5.1)
  # trades for a short-lived, per-publish registry token, after npmjs.com matches
  # this repo+workflow+environment against the package's configured Trusted
  # Publisher. Configure once per package on npmjs.com (Settings → Trusted
  # Publishers): org `lab255`, repo `OpenBook`, workflow `release.yml`,
  # environment `publish`. Replaces the expired/lost NPM_TOKEN that silently
  # blocked the 1.61–1.63 publishes.
  publish-npm:
    name: Publish libraries to npm
    # `preflight` is already transitive via `release`, but stays explicit so a
    # future refactor of `release`'s needs can't silently un-gate the npm
    # publish (it's the other irreversible step).
    needs: [plan, preflight, release]
    if: needs.plan.outputs.new_release == 'true'
    # Kept in `publish` for parity with publish-tauri, but no npm token is read
    # from it anymore — auth is OIDC (below).
    environment: publish
    runs-on: ubuntu-latest
    # OIDC trusted publishing: id-token mints the short-lived registry token AND
    # signs the build-provenance attestation. contents: read is the floor for
    # actions/checkout (the default `contents: read` is otherwise dropped once a
    # job declares any explicit permissions).
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }} # the tag nx release pushed
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          # Points npm at npmjs so the OIDC token exchange targets the right
          # registry. No NODE_AUTH_TOKEN is set, so the `_authToken` line
          # setup-node writes stays empty; npm >= 11.5.1 prefers the OIDC-minted
          # token over an empty static one, so the empty line is harmless.
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm CLI >= 11.5.1. pnpm 10.x's `publish` shells
      # out to whatever `npm` is on PATH (it only moved publishing in-process to
      # libnpmpublish in pnpm 11), so the OIDC flow is actually performed by this
      # npm — upgrading it here is load-bearing. Node 24 (.nvmrc) ships npm 11.13
      # today, which already qualifies, but older 24.x point releases shipped
      # 11.3.0 (< 11.5.1), so pin the floor explicitly rather than trust the
      # runner image. Bounded to ^11.5.1 (not @latest) so it auto-patches within
      # 11.x but never silently jumps to a future npm major that could change
      # OIDC/publish behaviour — same reasoning as pinning pnpm to 10.28.2.
      - name: Ensure npm >= 11.5.1 for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the libraries (sdk first; ui imports its types)
        env:
          # Sign the bundled first-party plugins with the production registry
          # key (ST-1) — the published @book.dev/ui ships bundled.gen.ts in its
          # dist. Unset until the key ceremony (docs/plugin-signing.md): the
          # build then warns and falls back to the committed TEST key, and the
          # bundled plugins show Unverified (the pre-signing status quo).
          OPENBOOK_REGISTRY_PRIVATE_KEY: ${{ secrets.OPENBOOK_REGISTRY_PRIVATE_KEY }}
          # Ceremony step 6 (docs/plugin-signing.md): once the secret above is
          # stored, uncomment so a later loss of the secret FAILS the build
          # instead of silently degrading to the TEST-signed fallback.
          # OPENBOOK_REGISTRY_REQUIRE_KEY: "1"
        run: |
          if [ -z "$OPENBOOK_REGISTRY_PRIVATE_KEY" ]; then
            echo "::warning::OPENBOOK_REGISTRY_PRIVATE_KEY is unset — bundled first-party plugins will be TEST-signed and show Unverified. Run the key ceremony (docs/plugin-signing.md) to enable production signing."
          fi
          pnpm --filter @book.dev/sdk build
          pnpm --filter @book.dev/ui build
          # Post-build backstop (ST-1, mirrors publish-tauri): with the secret
          # set, the freshly signed bundle must verify against a pinned key.
          if [ -n "$OPENBOOK_REGISTRY_PRIVATE_KEY" ]; then
            node scripts/check-bundled-signatures.mjs
          fi
      - name: Publish to npm (OIDC trusted publishing)
        env:
          # Trusted publishing attaches provenance automatically, but make it
          # explicit and robust: pnpm forwards the environment to the `npm`
          # subprocess, and npm reads NPM_CONFIG_PROVENANCE natively, so this
          # doesn't depend on pnpm forwarding a --provenance flag. Provenance
          # needs the public repo (it is) + a repository field in each
          # package.json (added in this change).
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          publish() {
            pkg="$1"; dir="$2"
            ver=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "$pkg@$ver already on the registry — skipping."
            else
              echo "Publishing $pkg@$ver…"
              # pnpm rewrites ui's `@book.dev/sdk: workspace:*` to the real
              # version at pack time, then hands off to `npm publish`, which does
              # the OIDC token exchange + provenance. --access public keeps both
              # packages public.
              pnpm --filter "$pkg" publish --no-git-checks --access public
            fi
          }
          publish "@book.dev/sdk" sdk
          publish "@book.dev/ui" ui
