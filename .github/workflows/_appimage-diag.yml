# TEMPORARY diagnostic — DELETE once the AppImage/linuxdeploy root cause is fixed.
#
# Purpose: the gated `release.yml` desktop-bundle job fails ONLY on the
# ubuntu-22.04 leg, ONLY at the AppImage step, with Tauri's generic wrapper
# `failed to run linuxdeploy` and NO underlying linuxdeploy stderr (the bundler
# swallows it without --verbose). `.deb`/`.rpm` build fine (they don't run
# linuxdeploy). This workflow reproduces ONLY the linux `tauri build` outside the
# gated release flow, with full verbose output, and then directly probes the Bun
# `--compile` sidecar (openbook-server) that is the prime suspect — so a single
# manual run reveals the exact failing sub-step + file.
#
# Run it from the Actions tab (workflow_dispatch). It uploads nothing and needs
# no secrets/environment/approval.
name: _AppImage diag (temporary)

on:
  # Branch-scoped push trigger: a workflow_dispatch-only workflow can't be
  # dispatched from a non-default branch (GitHub only registers dispatch after
  # the file lands on the default branch). Scoping push to THIS branch only lets
  # the diag auto-run on push here without firing on any other branch. Remove
  # together with this whole temporary file once the root cause is fixed.
  push:
    branches:
      - fix/appimage-linuxdeploy
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (blank = the ref this workflow runs from)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  appimage-diag:
    name: linuxdeploy verbose repro (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Same dependency set as release.yml's ubuntu leg.
      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Record patchelf version (linuxdeploy uses the system patchelf for rpath)
        run: patchelf --version || true

      # Mirror the release.yml fix: seed the patched GTK plugin so this diag
      # exercises (and proves) the fix rather than the broken upstream plugin.
      - name: Seed patched linuxdeploy GTK plugin
        run: |
          mkdir -p "$HOME/.cache/tauri"
          cp packages/app/src-tauri/linux/linuxdeploy-plugin-gtk.sh "$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"

      # The actual repro. `-vv` (two -v) makes Tauri's bundler stream
      # linuxdeploy + linuxdeploy-plugin-gtk stdout/stderr, so the real error
      # (e.g. `ERROR: Failed to run plugin: gtk`, an `ldd` failure, a
      # `patchelf ... rpath` failure, a `strip ... .relr.dyn` failure, or a
      # gdk-pixbuf `cp: cannot stat` error) is printed inline before the generic
      # `failed to run linuxdeploy` wrapper. continue-on-error so the probe step
      # below still runs and inspects whatever the build left behind.
      - name: Build Tauri (linux) with verbose linuxdeploy output
        id: build
        continue-on-error: true
        shell: bash
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SIDECAR_TARGET: x86_64-unknown-linux-gnu
        run: |
          set -o pipefail
          pnpm --filter @book.dev/app run tauri build --target x86_64-unknown-linux-gnu --verbose --verbose 2>&1 | tee /tmp/diag.log

      # Direct probe of the prime suspect (the Bun --compile sidecar). This is
      # the load-bearing diagnostic: it tells us whether `ldd` exits non-zero
      # (→ linuxdeploy gtk-plugin ldd-crash class) and whether `patchelf` can
      # even read the binary (→ rpath-rewrite failure class), independent of how
      # far the bundler got.
      - name: Probe the Bun sidecar + AppDir + linuxdeploy cache
        if: always()
        shell: bash
        run: |
          echo "===================== linuxdeploy / plugin / strip / patchelf error lines ====================="
          grep -niE "ERROR|Failed to run plugin|cannot stat|gdk-pixbuf|patchelf|strip|\.relr\.dyn|No such file|Permission|appimagetool|squashfs|ldd" /tmp/diag.log | tail -120 || true

          base="packages/app/src-tauri/target/x86_64-unknown-linux-gnu/release"
          echo
          echo "===================== Tauri linuxdeploy/plugin cache (~/.cache/tauri) ====================="
          ls -la "$HOME/.cache/tauri" 2>/dev/null || echo "(no ~/.cache/tauri)"

          echo
          echo "===================== AppDir/usr/bin contents (what linuxdeploy scanned) ====================="
          find "$base/bundle/appimage" -path "*/usr/bin/*" -maxdepth 6 -type f 2>/dev/null | while read -r f; do
            printf '%s  ->  ' "$f"; file -b "$f" 2>/dev/null || true
          done
          echo "(if empty, the bundler aborted before populating the AppDir)"

          echo
          echo "===================== Probe each candidate sidecar binary ====================="
          # Candidate locations for the bundled Bun --compile sidecar.
          for cand in \
            "$base"/openbook-server* \
            "packages/app/src-tauri/binaries"/openbook-server* \
            "$base"/bundle/appimage/*/usr/bin/openbook-server*; do
            [ -f "$cand" ] || continue
            echo "---- $cand ----"
            file -b "$cand" || true
            echo -n "ldd: "; ldd "$cand" >/dev/null 2>&1; echo "exit=$? (non-zero => linuxdeploy gtk-plugin ldd-crash class)"
            ldd "$cand" 2>&1 | head -5 || true
            echo -n "patchelf --print-rpath: "; patchelf --print-rpath "$cand" 2>&1; echo "  (patchelf exit=$?  non-zero/error => rpath-rewrite failure class)"
            echo -n "size: "; stat -c '%s bytes' "$cand" 2>/dev/null || true
          done

      - name: Surface the build outcome
        if: always()
        run: |
          echo "tauri build step outcome: ${{ steps.build.outcome }}"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed as expected — read the verbose linuxdeploy lines + sidecar probe above to identify the root cause."
          fi
